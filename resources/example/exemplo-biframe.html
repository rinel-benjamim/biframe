<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biframe — exemplo</title>
    <style>
      :root {
        --ink: #f2efe8;
        --muted: #8f8d95;
        --accent: #625bff;
        --stage: #0b0b0c;
        --line: #242429;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #050506;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: var(--ink);
      }

      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background:
          radial-gradient(1100px 680px at 72% 18%, rgba(98, 91, 255, 0.16), transparent 64%),
          radial-gradient(900px 600px at 8% 92%, rgba(226, 201, 160, 0.08), transparent 60%),
          var(--stage);
        transform-origin: center center;
      }

      #stage::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.036) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.036) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: linear-gradient(to bottom, #000 0%, transparent 86%);
        opacity: 0.8;
      }

      #stage::after {
        content: '';
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 140px rgba(0, 0, 0, 0.72);
        pointer-events: none;
      }

      .topbar {
        position: absolute;
        left: 64px;
        right: 64px;
        top: 46px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        opacity: 0;
        animation: appear 700ms 180ms cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.18em;
      }

      .mark {
        position: relative;
        width: 20px;
        height: 20px;
        border: 1.5px solid currentColor;
        border-radius: 5px;
      }

      .mark::after {
        content: '';
        position: absolute;
        left: 6px;
        top: 5px;
        border-left: 6px solid var(--accent);
        border-top: 4.5px solid transparent;
        border-bottom: 4.5px solid transparent;
      }

      .meta,
      .mono {
        font-family: 'Cascadia Mono', 'Consolas', monospace;
      }

      .meta {
        font-size: 10.5px;
        letter-spacing: 0.12em;
        color: var(--muted);
      }

      .hero {
        position: absolute;
        left: 64px;
        top: 176px;
        width: 900px;
      }

      .rule {
        width: 0;
        height: 1px;
        background: var(--accent);
        margin-bottom: 27px;
        animation: draw 900ms 600ms cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      }

      h1 {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 400;
        font-size: 92px;
        line-height: 0.98;
        letter-spacing: -0.035em;
      }

      .line {
        display: block;
        overflow: hidden;
        padding-bottom: 4px;
      }

      .line span {
        display: block;
        transform: translateY(112%);
        animation: rise 900ms 800ms cubic-bezier(0.16, 0.84, 0.24, 1) forwards;
      }

      .line:nth-child(2) span {
        animation-delay: 1030ms;
        color: var(--accent);
        font-style: italic;
      }

      .sub {
        margin: 26px 0 0;
        font-size: 16px;
        letter-spacing: 0.01em;
        color: var(--muted);
        opacity: 0;
        animation: appear 800ms 1500ms ease forwards;
      }

      .film {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 104px;
        height: 128px;
        display: flex;
        gap: 8px;
        opacity: 0;
        transform: translateY(22px);
        animation: filmin 900ms 2200ms cubic-bezier(0.16, 0.84, 0.24, 1) forwards;
      }

      .frame {
        position: relative;
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 5px;
        overflow: hidden;
        background: #111114;
        filter: saturate(0.9) brightness(0.72);
        animation: light 1600ms cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      }

      .frame:nth-child(1) {
        animation-delay: 2600ms;
      }

      .frame:nth-child(2) {
        animation-delay: 3150ms;
      }

      .frame:nth-child(3) {
        animation-delay: 3700ms;
      }

      .frame:nth-child(4) {
        animation-delay: 4250ms;
      }

      .frame:nth-child(5) {
        animation-delay: 4800ms;
      }

      .frame::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(98, 91, 255, 0.26), transparent 55%);
      }

      .frame::after {
        content: attr(data-n);
        position: absolute;
        left: 12px;
        bottom: 9px;
        font-family: 'Cascadia Mono', 'Consolas', monospace;
        font-size: 10px;
        color: rgba(242, 239, 232, 0.62);
      }

      .frame i {
        position: absolute;
        display: block;
        border-radius: 999px;
        background: rgba(242, 239, 232, 0.82);
      }

      .f1 i {
        width: 46px;
        height: 46px;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
      }

      .f2 i {
        width: 70%;
        height: 1px;
        left: 15%;
        top: 36%;
        box-shadow: 0 12px 0 rgba(242, 239, 232, 0.38), 0 -12px 0 rgba(242, 239, 232, 0.2);
      }

      .f3 i {
        width: 34px;
        height: 34px;
        left: 28%;
        top: 38%;
        background: var(--accent);
      }

      .f3::before {
        background: linear-gradient(200deg, rgba(226, 201, 160, 0.24), transparent 62%);
      }

      .f4 i {
        width: 62%;
        height: 42%;
        left: 19%;
        top: 25%;
        border: 1px solid rgba(242, 239, 232, 0.55);
        background: transparent;
      }

      .f5 i {
        width: 18px;
        height: 18px;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -50%);
        background: var(--accent);
      }

      .playhead {
        position: absolute;
        top: -12px;
        bottom: -12px;
        left: 0;
        width: 1px;
        background: var(--accent);
        box-shadow: 0 0 18px rgba(98, 91, 255, 0.8);
        animation: play 4300ms 2600ms linear forwards;
      }

      .playhead::before {
        content: '';
        position: absolute;
        top: 0;
        left: -4px;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        background: var(--accent);
        transform: rotate(45deg);
      }

      .bottom {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 42px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        font-size: 10.5px;
        letter-spacing: 0.13em;
        color: var(--muted);
        border-top: 1px solid var(--line);
        padding-top: 15px;
        opacity: 0;
        animation: appear 700ms 2400ms ease forwards;
      }

      .end {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 250px;
        text-align: center;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 42px;
        font-style: italic;
        letter-spacing: -0.02em;
        color: var(--ink);
        opacity: 0;
        transform: translateY(12px);
        animation: endin 900ms 6100ms cubic-bezier(0.16, 0.84, 0.24, 1) forwards;
      }

      .end small {
        display: block;
        margin-top: 14px;
        font-family: 'Cascadia Mono', 'Consolas', monospace;
        font-style: normal;
        font-size: 10.5px;
        letter-spacing: 0.16em;
        color: var(--muted);
      }

      .hero {
        animation: heroout 700ms 5600ms ease forwards;
      }

      @keyframes appear {
        to {
          opacity: 1;
        }
      }

      @keyframes draw {
        to {
          width: 72px;
        }
      }

      @keyframes rise {
        to {
          transform: translateY(0);
        }
      }

      @keyframes filmin {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes light {
        0% {
          filter: saturate(0.9) brightness(0.72);
        }
        100% {
          filter: saturate(1) brightness(1.08);
          border-color: rgba(98, 91, 255, 0.55);
        }
      }

      @keyframes play {
        from {
          left: 0;
        }
        to {
          left: 100%;
        }
      }

      @keyframes heroout {
        to {
          opacity: 0;
          transform: translateY(-18px);
        }
      }

      @keyframes endin {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="topbar">
        <div class="brand"><span class="mark"></span> BIFRAME</div>
        <div class="meta">EXEMPLO · 8 SEGUNDOS · 30 FPS</div>
      </div>

      <div class="hero">
        <div class="rule"></div>
        <h1>
          <span class="line"><span>Uma página.</span></span>
          <span class="line"><span>Um vídeo.</span></span>
        </h1>
        <p class="sub">Animação real, capturada frame a frame — sem gravação de ecrã.</p>
      </div>

      <div class="film">
        <div class="frame f1" data-n="001"><i></i></div>
        <div class="frame f2" data-n="042"><i></i></div>
        <div class="frame f3" data-n="096"><i></i></div>
        <div class="frame f4" data-n="151"><i></i></div>
        <div class="frame f5" data-n="214"><i></i></div>
        <div class="playhead"></div>
      </div>

      <div class="end">
        Do movimento ao MP4.
        <small>H.264 · YUV 4:2:0 · VALIDADO</small>
      </div>

      <div class="bottom">
        <span class="mono">HTML → CHROMIUM → H.264</span>
        <span class="mono" id="time">00:00:00</span>
      </div>
    </div>

    <script>
      (function () {
        var stage = document.getElementById('stage');
        var time = document.getElementById('time');

        function fit() {
          var scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
          stage.style.transform = 'scale(' + scale + ')';
        }
        fit();
        window.addEventListener('resize', fit);

        var started = performance.now();
        function tick(now) {
          var elapsed = (now - started) / 1000;
          var seconds = Math.min(8, Math.floor(elapsed));
          time.textContent = '00:00:0' + seconds;
          if (elapsed < 8) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);

        window.biframe = { duration: 8, ready: true, deterministic: true };
        window.setTimeout(function () {
          window.dispatchEvent(new CustomEvent('biframe:complete'));
        }, 8000);
      })();
    </script>
  </body>
</html>
