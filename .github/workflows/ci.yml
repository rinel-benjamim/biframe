name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: UI tests
        run: npx vitest run --project ui
      - name: Integration tests
        run: npm run test:integration

  # The end-to-end suite drives a real Electron window and a packaged build;
  # it is run locally as described in CONTRIBUTING.md until a Windows runner
  # proves reliable for it.
